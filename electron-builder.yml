appId: com.furiberto.desktoppet
productName: DesktopPet
copyright: Copyright © Furiberto
asar: true
directories:
  output: out
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!**/*.map"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
extraMetadata:
  main: electron/main.cjs
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  # true = 安装向导里可勾选/取消「创建桌面快捷方式」（默认勾选）
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DesktopPet 桌宠
  uninstallDisplayName: DesktopPet 桌宠
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerLanguages:
    - zh_CN
    - en_US
  language: 2052
  artifactName: DesktopPet-Setup-${version}.${ext}
portable:
  artifactName: DesktopPet-Portable-${version}.${ext}
mac:
  icon: build/icon.png
  target:
    - dmg
  category: public.app-category.entertainment
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Utility
